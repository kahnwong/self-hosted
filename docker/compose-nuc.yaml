services:
  syncthing:
    image: linuxserver/syncthing:2.1.7
    container_name: syncthing
    environment:
      PUID: 0
      PGID: 0
      TZ: Asia/Bangkok
      UMASK_SET: <022>
    volumes:
      - /opt/syncthing/config:/config
      - /opt/syncthing/:/data
      - /opt/immich/upload:/data/immich/upload
    ports:
      - 8384:8384
      - 22000:22000
      - 21027:21027/udp
    restart: always
    networks:
      - syncthing
  transmission:
    image: linuxserver/transmission:2021.11.18
    container_name: transmission
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Asia/Bangkok
    volumes:
      - /opt/transmission/config:/config
      - /opt/transmission/downloads:/downloads
      - /opt/transmission/watch:/watch
    ports:
      - 9091:9091
      - 51413:51413
      - 51413:51413/udp
    restart: always
    env_file: .env.app.transmission
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - transmission
  home_assistant:
    container_name: home-assistant
    image: "ghcr.io/home-assistant/home-assistant:stable"
    volumes:
      - /opt/home-assistant/config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: always
    environment:
      TZ: Asia/Bangkok
    ports:
      # Web UI
      - "8123:8123/tcp"
      # Camera Live Streams & Discovery
      - "554:554/tcp" # RTSP feed
      - "1984:1984/tcp" # go2rtc Web UI / API
      - "8555:8555/tcp" # WebRTC signaling
      - "8555:8555/udp" # WebRTC media
    networks:
      - home_assistant
networks:
  syncthing:
    driver: bridge
  transmission:
    driver: bridge
  home_assistant:
    driver: bridge
