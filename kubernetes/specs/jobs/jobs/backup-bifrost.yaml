name: backup-bifrost
schedule: "1 0 * * *"
containers:
  - name: backup-bifrost
    repository: ghcr.io/kahnwong/docker-aws-backup
    tag: 33ad35b
    env:
      - name: MODE
        value: ARCHIVE
      - name: SERVICE_NAME
        value: bifrost
      - name: BACKUP_PATH
        value: /opt/bifrost
    envFrom:
      - secretRef:
          name: backup
    volumeMounts:
      - name: bifrost
        mountPath: /opt/bifrost
volumes:
  - name: bifrost
    hostPath:
      path: /opt/bifrost
