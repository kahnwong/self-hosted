name: backup-readeck-content
schedule: "0 23 1 * *"
containers:
  - name: backup-readeck-content
    repository: ghcr.io/kahnwong/docker-aws-backup
    tag: 33ad35b
    env:
      - name: MODE
        value: ARCHIVE
      - name: SERVICE_NAME
        value: readeck-content
      - name: BACKUP_PATH
        value: /opt/readeck/data/data/bookmarks
      - name: BUCKET_NAME
        value: backup-monthly
    envFrom:
      - secretRef:
          name: backup
    volumeMounts:
      - name: readeck
        mountPath: /opt/readeck
volumes:
  - name: readeck
    hostPath:
      path: /opt/readeck
