expose:
  type: nodePort
  tls:
    enabled: false
  nodePort:
    name: harbor
    ports:
      http:
        port: 80
        nodePort: 30500
      https:
        port: 443
        nodePort: 30501
    annotations: {}
externalURL: https://harbor.karnwong.me
database:
  type: external
  external:
    host: "harbor-postgres-rw.harbor.svc.cluster.local"
    port: "5432"
    username: "harbor"
    coreDatabase: "registry"
    existingSecret: "harbor"
    sslmode: "disable"
persistence:
  persistentVolumeClaim:
    registry:
      existingClaim: "harbor-registry-pvc"
      storageClass: ""

