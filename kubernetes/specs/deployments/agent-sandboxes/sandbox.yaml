kind: Deployment
name: sandbox
serviceAccount: sa-sandbox
replicaCount: 1
kubeGreen: true
containers:
  - name: sandbox
    repository: ghcr.io/kahnwong/sandbox
    tag: 20a20ee
    port: 3000
    env:
      - name: LOG_LEVEL
        value: "error"
      - name: SANDBOX_IMAGE
        value: "ghcr.io/kahnwong/sandbox-template:20a20ee"
      - name: SANDBOX_SHELL
        value: "/usr/bin/fish"
      - name: SANDBOX_PULL_SECRET_NAME
        value: "ghcr-cfg"
service:
  port: 3000
  nodePort: 30087
imagePullSecrets:
  - name: ghcr-cfg
