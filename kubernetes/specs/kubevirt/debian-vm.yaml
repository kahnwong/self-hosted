---
apiVersion: v1
kind: Service
metadata:
  name: debian-vm-ssh
  namespace: vms
spec:
  type: NodePort
  selector:
    kubevirt.io/vm: debian-vm
  ports:
    - protocol: TCP
      port: 22
      targetPort: 22
      nodePort: 30200
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: debian-vm
  namespace: vms
spec:
  runStrategy: Halted
  template:
    spec:
    metadata:
      labels:
        kubevirt.io/vm: debian-vm
      architecture: amd64
      domain:
        devices:
          disks:
            - name: debian-boot-volume
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
        resources:
          requests:
            memory: 512Mi
            cpu: 1
        cpu:
          cores: 2
      networks:
        - name: default
          pod: {}
      volumes:
        - name: debian-boot-volume
          dataVolume:
            name: debian-boot-volume
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              hostname: debian-vm
              users:
              - name: debian
                sudo: ALL=(ALL) NOPASSWD:ALL
                shell: /bin/bash
                ssh_authorized_keys:
                - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGxegedeKKWLetfIMjMe+fPFGIx1pIfanpAUVqrTydE9
              ssh_pwauth: true
              disable_root: false
              chpasswd:
                list: |
                  debian:debian
                expire: false
              package_update: true
              packages:
              - qemu-guest-agent
              runcmd:
              - systemctl enable ssh
              - systemctl start ssh
            networkData: |-
              network:
                version: 2
                ethernets:
                  enp1s0:
                    match:
                      # macaddress: "xx:xx:xx:xx:xx:xx"
                      name: e*  # add this line
                    dhcp4: true
                    dhcp6: true
                    set-name: "enp1s0"
  dataVolumeTemplates:
    - metadata:
        name: debian-boot-volume
      spec:
        source:
          registry:
            url: "docker://quay.io/containerdisks/debian:latest"
            platform:
              architecture: amd64
        storage:
          resources:
            requests:
              storage: 8Gi
          accessModes:
            - ReadWriteOnce
