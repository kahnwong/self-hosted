# Go template rendered by main.go; do not apply this file directly.
---
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-ssh" .Name | quote }}
  namespace: vms
spec:
  type: NodePort
  selector:
    kubevirt.io/vm: {{ printf "%s" .Name | quote }}
  ports:
    - protocol: TCP
      port: 22
      targetPort: 22
      nodePort: {{ .NodePort }}
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: {{ printf "%s" .Name | quote }}
  namespace: vms
spec:
  runStrategy: Halted
  template:
    metadata:
      labels:
        kubevirt.io/vm: {{ printf "%s" .Name | quote }}
    spec:
      architecture: amd64
      domain:
        devices:
          disks:
            - name: {{ printf "%s-boot-volume" .Name | quote }}
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
        resources:
          requests:
            memory: {{ .Memory | quote }}
            cpu: {{ .CPU | quote }}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: {{ printf "%s-boot-volume" .Name | quote }}
          dataVolume:
            name: {{ printf "%s-boot-volume" .Name | quote }}
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
{{ .CloudInit | indent 14 }}
            networkData: |-
              network:
                version: 2
                ethernets:
                  enp1s0:
                    match:
                      name: e*
                    dhcp4: true
                    dhcp6: true
                    set-name: "enp1s0"
  dataVolumeTemplates:
    - metadata:
        name: {{ printf "%s-boot-volume" .Name | quote }}
      spec:
        source:
          registry:
            url: {{ .Image | quote }}
            platform:
              architecture: amd64
        storage:
          resources:
            requests:
              storage: 8Gi
          accessModes:
            - ReadWriteOnce
